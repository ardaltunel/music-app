name: Supabase Keep Alive

on:
  schedule:
    # Original schedule: every third calendar day, at 21:00 UTC.
    - cron: "0 21 */3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-keep-alive.yml
      - .github/scripts/supabase-keep-alive.mjs
      - .github/scripts/supabase-keep-alive.test.mjs
      - assets/js/supabase-config.js

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            assets/js

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test health check behavior
        run: node --test .github/scripts/supabase-keep-alive.test.mjs
      - name: Verify a real database response
        run: node .github/scripts/supabase-keep-alive.mjs
      - name: Explain failure
        if: failure()
        run: |
          echo '### Supabase health check failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'No healthy result was recorded. Check project status and API availability. Public API keys cannot resume paused projects.' >> "$GITHUB_STEP_SUMMARY"

  record-monthly-health:
    needs: ping-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Only this small, post-success job may update the repository.
    permissions:
      contents: write
    steps:
      - name: Record verified health at most once every 30 days
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/maintenance/supabase-health.json';
            const branch = context.payload.repository.default_branch;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            let previous;
            try {
              previous = (await github.rest.repos.getContent({ ...repo, path, ref: branch })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const now = new Date();
            if (previous) {
              const state = JSON.parse(Buffer.from(previous.content, 'base64').toString('utf8'));
              const age = now.getTime() - Date.parse(state.checked_at);
              if (age >= 0 && age < 30 * 24 * 60 * 60 * 1000) {
                core.info('Monthly health record is current; no commit needed.');
                return;
              }
            }
            const content = JSON.stringify({
              project_ref: 'zgqjzsueslitzyewoqwc',
              checked_at: now.toISOString(),
              database_query: 'healthy',
              workflow_run: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            }, null, 2) + '\n';
            await github.rest.repos.createOrUpdateFileContents({
              ...repo, path, branch,
              message: 'chore: record monthly Supabase health check',
              content: Buffer.from(content).toString('base64'),
              ...(previous ? { sha: previous.sha } : {})
            });
            core.info('Recorded successful health check; repository activity is refreshed.');
