name: Supabase Keep Alive

on:
  schedule:
    # Run every 3 days to keep the free Supabase project active.
    - cron: "0 21 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Supabase configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_URL=$(sed -n "s/.*url: '\([^']*\)'.*/\1/p" assets/js/supabase-config.js | head -n 1)
          SUPABASE_ANON_KEY=$(sed -n "s/.*anonKey: '\([^']*\)'.*/\1/p" assets/js/supabase-config.js | head -n 1)

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Supabase URL or anon key could not be read from assets/js/supabase-config.js" >&2
            exit 1
          fi

          echo "url=$SUPABASE_URL" >> "$GITHUB_OUTPUT"
          echo "anon_key=$SUPABASE_ANON_KEY" >> "$GITHUB_OUTPUT"

      - name: Query Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ steps.config.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.config.outputs.anon_key }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "$SUPABASE_URL/rest/v1/songs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

          echo "Supabase keep-alive query completed successfully."
