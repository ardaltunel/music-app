<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Arda Altunel Music kayıt">
    <title>Kayıt Ol - Arda Altunel Music</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-icon-180x180.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=9">
    <link rel="stylesheet" href="assets/css/overscroll-fix.css">
</head>
<body data-page="register">
<section class="form-container auth-page">
    <h3 class="heading"><a href="index.html">Music</a></h3>
    <form data-register-form>
        <div data-message-area></div>
        <p>Ad Soyad <span>*</span></p>
        <input type="text" name="name" placeholder="Adınız" required maxlength="100" class="box">
        <p>E-posta <span>*</span></p>
        <input type="email" name="email" placeholder="E-posta adresiniz" required maxlength="150" class="box">
        <p>Şifre <span>*</span></p>
        <div class="password-field">
            <input type="password" name="password" placeholder="En az 6 karakter" required minlength="6" class="box">
            <button type="button" class="toggle-password" aria-label="Şifreyi göster"><i class="fas fa-eye"></i></button>
        </div>
        <p>Şifre Tekrar <span>*</span></p>
        <div class="password-field">
            <input type="password" name="password_confirm" placeholder="Şifrenizi tekrar girin" required minlength="6" class="box">
            <button type="button" class="toggle-password" aria-label="Şifreyi göster"><i class="fas fa-eye"></i></button>
        </div>
        <button type="submit" class="btn">Kayıt Ol</button>
        <div class="auth-divider" aria-hidden="true"><span>veya</span></div>
        <button type="button" class="google-auth-btn" data-google-auth>
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path fill="#4285f4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.38a4.6 4.6 0 0 1-2 3.01v2.53h3.24c1.9-1.75 2.98-4.33 2.98-7.38Z"/>
                <path fill="#34a853" d="M12 22c2.7 0 4.97-.9 6.62-2.39l-3.24-2.53c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10 10 0 0 0 12 22Z"/>
                <path fill="#fbbc05" d="M6.39 13.91A6.02 6.02 0 0 1 6.07 12c0-.66.11-1.3.32-1.91V7.48H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.52l3.35-2.61Z"/>
                <path fill="#ea4335" d="M12 5.96c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.96 5.48l3.35 2.61C7.18 7.72 9.39 5.96 12 5.96Z"/>
            </svg>
            <span>Google ile Kayıt Ol</span>
        </button>
        <a href="login.html" class="option-btn">Giriş Yap</a>
        <a href="index.html" class="option-btn">Ana Sayfaya Dön</a>
    </form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/app.js?v=13"></script>
</body>
</html>
