<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Arda Altunel Music kayıt">
    <title>Kayıt Ol - Arda Altunel Music</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-icon-180x180.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=14">
    <link rel="stylesheet" href="assets/css/library.css?v=14">

    <meta name="robots" content="noindex,follow">
</head>
<body data-page="register">
<a class="skip-link" href="#main">İçeriğe geç</a>
<main id="main" class="form-container auth-page">
    <a class="auth-brand" href="index.html">m. <span>Music</span></a>
    <div class="auth-intro"><p class="eyebrow">MÜZİK BİR ARAYA GETİRİR</p><h1>Müziğe katıl.</h1><p>Hesabını oluştur, sevdiğin şarkıları paylaş.</p></div>
    <form method="post" data-register-form>
        <div data-message-area aria-live="polite" aria-atomic="true"></div>
        <label for="name">Ad Soyad <span>*</span></label>
        <input id="name" type="text" name="name" autocomplete="name" placeholder="Adınız" required maxlength="100" class="box">
        <label for="email">E-posta <span>*</span></label>
        <input id="email" type="email" name="email" autocomplete="email" placeholder="E-posta adresiniz" required maxlength="150" class="box">
        <label for="password">Şifre <span>*</span></label>
        <div class="password-field">
            <input id="password" type="password" name="password" autocomplete="new-password" placeholder="En az 6 karakter" required minlength="6" class="box">
            <button type="button" class="toggle-password" aria-label="Şifreyi göster"><i aria-hidden="true" class="fas fa-eye"></i></button>
        </div>
        <label for="password_confirm">Şifre Tekrar <span>*</span></label>
        <div class="password-field">
            <input id="password_confirm" type="password" name="password_confirm" autocomplete="new-password" placeholder="Şifrenizi tekrar girin" required minlength="6" class="box">
            <button type="button" class="toggle-password" aria-label="Şifreyi göster"><i aria-hidden="true" class="fas fa-eye"></i></button>
        </div>
        <button type="submit" class="btn">Kayıt Ol</button>
        <div class="auth-divider" aria-hidden="true"><span>veya</span></div>
        <button type="button" class="google-auth-btn" data-google-auth>
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path fill="#4285f4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.38a4.6 4.6 0 0 1-2 3.01v2.53h3.24c1.9-1.75 2.98-4.33 2.98-7.38Z"/>
                <path fill="#34a853" d="M12 22c2.7 0 4.97-.9 6.62-2.39l-3.24-2.53c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10 10 0 0 0 12 22Z"/>
                <path fill="#fbbc05" d="M6.39 13.91A6.02 6.02 0 0 1 6.07 12c0-.66.11-1.3.32-1.91V7.48H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.52l3.35-2.61Z"/>
                <path fill="#ea4335" d="M12 5.96c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.96 5.48l3.35 2.61C7.18 7.72 9.39 5.96 12 5.96Z"/>
            </svg>
            <span>Google ile Kayıt Ol</span>
        </button>
        <a href="login.html" class="option-btn">Giriş Yap</a>
        <a href="index.html" class="option-btn">Ana Sayfaya Dön</a>
    </form>
</main>
<footer class="site-footer"><a href="index.html">Music / Arda Altunel</a><span>Hayatın arka planında iyi müzik.</span></footer>

<script src="assets/js/core.js"></script>
<script src="assets/js/app.js?v=14"></script>
</body>
</html>
