<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Arda Altunel Music arama">
    <title>Arama - Arda Altunel Music</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-icon-180x180.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=14">
    <link rel="stylesheet" href="assets/css/library.css?v=14">

    <meta name="robots" content="noindex,follow">
</head>
<body data-page="search">
<a class="skip-link" href="#main">İçeriğe geç</a>
<header class="site-header">
    <a href="index.html" class="brand" aria-label="Music ana sayfa"><span class="brand-symbol" aria-hidden="true">m.</span>Music<span class="brand-caption">SEÇ, DİNLE, PAYLAŞ.</span></a>
    <nav class="top-nav" aria-label="Ana menü" data-auth-nav>
        <a href="upload.html"><i aria-hidden="true" class="fas fa-cloud-arrow-up"></i><span>Müzik Ekle</span></a>
        <a href="login.html"><i aria-hidden="true" class="fas fa-right-to-bracket"></i><span>Giriş</span></a>
    </nav>
</header>

<main class="playlist" id="main">
    <div class="page-title">
        <h1 data-search-title>Arama Sonuçları</h1>
        <p data-search-summary></p>
    </div>

    <section class="search__bar">
        <form class="container search__bar-container" data-search-form role="search">
            <i aria-hidden="true" class="fas fa-search"></i>
            <input type="search" aria-label="Şarkı veya sanatçı ara" maxlength="100" name="search" placeholder="Şarkı veya sanatçı ara" autocomplete="off">
            <button type="submit">Ara</button>
        </form>
    </section>

    <h2 class="sr-only">Şarkılar</h2>
    <div class="box-container" data-song-grid>
        <article class="box more-btn">
            <p class="empty-state">Sonuçlar yükleniyor...</p>
        </article>
    </div>
</main>

<div class="music-player" id="myModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="player-title">
    <div class="main-box">
        <div class="box box-custom">
            <button class="player-close" id="close" type="button" aria-label="Oynatıcıyı kapat">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <div class="player-heading">
                <div class="name" id="player-title"></div>
                <div class="artist"></div>
            </div>
            <img src="assets/images/disc.png" class="album" alt="">
            <div class="youtube-player" data-youtube-player hidden></div>
            <div class="player-controls" data-native-player>
                <audio class="music" id="myAudio" preload="none"></audio>
                <div class="player-control-row">
                    <div class="player-volume-group">
                        <button class="player-control-button" type="button" data-player-mute aria-label="Sesi kapat">
                            <i aria-hidden="true" class="fas fa-volume-high"></i>
                        </button>
                        <input class="player-volume" type="range" min="0" max="1" value="1" step="0.01" data-player-volume aria-label="Ses seviyesi">
                    </div>
                    <div class="player-skip-group">
                        <button class="player-control-button player-skip-button" id="prev_song_button" type="button" aria-label="Önceki şarkı">
                            <i class="fa fa-angle-left" aria-hidden="true"></i>
                        </button>
                        <button class="player-control-button is-primary" type="button" data-player-toggle aria-label="Oynat">
                            <i aria-hidden="true" class="fas fa-play"></i>
                        </button>
                        <button class="player-control-button player-skip-button" id="next_song_button" type="button" aria-label="Sonraki şarkı">
                            <i class="fa fa-angle-right" aria-hidden="true"></i>
                        </button>
                    </div>
                    <a class="player-download" href="#" data-player-download>
                        <i aria-hidden="true" class="fas fa-download"></i><span>İndir</span>
                    </a>
                </div>
                <div class="player-timeline">
                    <div class="player-time">
                        <span data-current-time>0:00</span>
                        <span data-duration>0:00</span>
                    </div>
                    <input class="player-progress" type="range" min="0" max="100" value="0" step="0.1" data-player-progress aria-label="Şarkı ilerleme durumu">
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="site-footer"><a href="index.html">Music / Arda Altunel</a><span>Hayatın arka planında iyi müzik.</span></footer>
<noscript><p class="empty-state">Şarkıları dinlemek ve hesabınıza giriş yapmak için JavaScript’i etkinleştirin.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/app.js?v=14"></script>
</body>
</html>
